name: Build DNSYar Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DNSYar.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish DNSYar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o .\Release\win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-win-x64
          path: Release/win-x64/**
          if-no-files-found: error
