name: Build DNSYar Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DNSYar.Tests/DNSYar.Tests.csproj
      - name: Unit tests
        run: dotnet test DNSYar.Tests/DNSYar.Tests.csproj -c Release --no-restore
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish DNSYar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o .\Release\win-x64
      - name: Validate published app
        shell: pwsh
        run: |
          if (!(Test-Path .\Release\win-x64\DNSYar.exe)) { throw 'DNSYar.exe was not produced.' }
          if (!(Test-Path .\Release\win-x64\Data\dns.json)) { throw 'DNS catalog was not packaged.' }
          if (!(Test-Path .\Release\win-x64\Data\services.json)) { throw 'Service catalog was not packaged.' }
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DNSYar-win-x64
          path: Release/win-x64/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout and verify tag belongs to main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release ancestry
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DNSYar-win-x64
          path: Release/win-x64
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path .\Release\win-x64\* -DestinationPath .\DNSYar-${{ github.ref_name }}-win-x64.zip -Force
          (Get-FileHash .\DNSYar-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash.ToLower() + '  DNSYar-${{ github.ref_name }}-win-x64.zip' | Set-Content .\DNSYar-${{ github.ref_name }}-SHA256.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            DNSYar-${{ github.ref_name }}-win-x64.zip
            DNSYar-${{ github.ref_name }}-SHA256.txt
          name: DNSYar ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            بسته ویندوز x64 به‌صورت self-contained است. ZIP را کامل Extract کنید و DNSYar.exe را اجرا کنید.
            فایل SHA256 کنار بسته برای بررسی صحت دانلود ارائه شده است.
