name: Build DNSYar Windows

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - ARM64
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            platform: x64
          - arch: ARM64
            rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DNSYar.csproj

      - name: Publish ${{ matrix.arch }}
        shell: pwsh
        run: |
          $out = "Release\${{ matrix.rid }}"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          
          dotnet publish DNSYar.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o $out

      - name: Package ${{ matrix.arch }}
        shell: pwsh
        run: |
          $zipName = "DNSYar-${{ matrix.rid }}.zip"
          Compress-Archive -Path "Release\${{ matrix.rid }}\*" -DestinationPath $zipName -Force

      - name: Upload artifact ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-${{ matrix.rid }}
          path: DNSYar-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
