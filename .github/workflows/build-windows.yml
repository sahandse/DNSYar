name: Build DNSYar Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish a GitHub Release for (e.g. v0.7.2). Leave empty to just build.'
        required: false
        type: string
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DNSYar.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish DNSYar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o .\Release\win-x64

      - name: Diagnose publish output (temporary - investigating XamlParseException)
        shell: pwsh
        run: |
          $out = "Release\win-x64"
          Write-Host "== resources.pri =="
          Get-ChildItem -Path $out -Filter "resources.pri" -Recurse | ForEach-Object { Write-Host "$($_.FullName)  ($($_.Length) bytes)" }
          if (-not (Get-ChildItem -Path $out -Filter "resources.pri" -Recurse)) { Write-Host "MISSING: no resources.pri found anywhere under $out" }

          Write-Host "== WindowsAppRuntime / WinUI native files =="
          Get-ChildItem -Path $out -Filter "*WindowsAppRuntime*" -Recurse | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem -Path $out -Filter "Microsoft.ui.xaml.dll" -Recurse | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem -Path $out -Filter "Microsoft.WindowsAppRuntime.Bootstrap.dll" -Recurse | ForEach-Object { Write-Host $_.FullName }

          Write-Host "== DNSYar.exe / DNSYar.dll presence =="
          Get-ChildItem -Path $out -Filter "DNSYar.*" | ForEach-Object { Write-Host "$($_.Name)  ($($_.Length) bytes)" }

          Write-Host "== app.manifest embedded check (via DNSYar.exe) =="
          $exe = Join-Path $out "DNSYar.exe"
          if (Test-Path $exe) {
            $sigtool = Get-Command mt.exe -ErrorAction SilentlyContinue
            Write-Host "DNSYar.exe exists, size: $((Get-Item $exe).Length) bytes"
          }

          Write-Host "== Full top-level output listing =="
          Get-ChildItem -Path $out | ForEach-Object { Write-Host "$($_.Name)$(if($_.PSIsContainer){'/'})" }

          Write-Host "== Total file count and size =="
          $all = Get-ChildItem -Path $out -Recurse -File
          Write-Host "Files: $($all.Count), Total size: $([math]::Round(($all | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-win-x64
          path: Release/win-x64/**
          if-no-files-found: error

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content DNSYar.csproj)
          $version = $xml.Project.PropertyGroup.Version | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.version }} `
            installer\DNSYar.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-Setup-${{ steps.version.outputs.version }}
          path: Release/installer/*.exe
          if-no-files-found: error

      - name: Determine release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.release_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.release_tag }}"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: DNSYar ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Release/installer/*.exe
