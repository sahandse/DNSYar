name: Build DNSYar Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish a GitHub Release for (e.g. v0.7.2). Leave empty to just build.'
        required: false
        type: string
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DNSYar.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish DNSYar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o .\Release\win-x64

      - name: Copy resources.pri into publish output (WindowsAppSDK unpackaged-publish bug)
        shell: pwsh
        run: |
          # dotnet publish for an unpackaged (WindowsPackageType=None) Windows App SDK app
          # generates resources.pri in the intermediate bin\ output but does not copy it to
          # the publish folder - a known upstream bug (microsoft/WindowsAppSDK#3451). Without
          # it, Application.LoadComponent's ms-appx:/// resolution fails for the app's own
          # compiled MainWindow.xaml on every launch (XamlParseException, no useful message).
          $out = "Release\win-x64"
          $pri = Get-ChildItem -Path "bin","obj" -Filter "resources.pri" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pri) {
            Write-Host "##[error]resources.pri not found anywhere under bin\ or obj\ - cannot fix the publish output."
            exit 1
          }
          Write-Host "Found resources.pri: $($pri.FullName) ($($pri.Length) bytes)"
          Copy-Item -Path $pri.FullName -Destination (Join-Path $out "resources.pri") -Force
          if (-not (Test-Path (Join-Path $out "resources.pri"))) {
            Write-Host "##[error]Copy failed: resources.pri still missing from $out"
            exit 1
          }
          Write-Host "Copied resources.pri into $out"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-win-x64
          path: Release/win-x64/**
          if-no-files-found: error

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content DNSYar.csproj)
          $version = $xml.Project.PropertyGroup.Version | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.version }} `
            installer\DNSYar.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-Setup-${{ steps.version.outputs.version }}
          path: Release/installer/*.exe
          if-no-files-found: error

      - name: Determine release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.release_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.release_tag }}"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: DNSYar ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Release/installer/*.exe
