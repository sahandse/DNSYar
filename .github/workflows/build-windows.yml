name: Build DNSYar Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DNSYar.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish DNSYar.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o .\Release\win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-win-x64
          path: Release/win-x64/**
          if-no-files-found: error

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content DNSYar.csproj)
          $version = $xml.Project.PropertyGroup.Version | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.version }} `
            installer\DNSYar.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSYar-Setup-${{ steps.version.outputs.version }}
          path: Release/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DNSYar ${{ github.ref_name }}
          generate_release_notes: true
          files: Release/installer/*.exe
